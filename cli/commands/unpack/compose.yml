services:
  unpack:
    build:
      context: '.'
      dockerfile: 'Dockerfile'
    image: 'javatales-unpack:local'
    pull_policy: 'build'
    restart: 'no'
    stdin_open: false
    tty: false
    read_only: true
    user: '${UNPACK_UID:?set UNPACK_UID}:${UNPACK_GID:?set UNPACK_GID}'
    network_mode: 'none'
    working_dir: '/tmp'
    environment:
      HOME: '/tmp'
      TMPDIR: '/tmp'
    tmpfs:
      - '/tmp'
    volumes:
      - type: 'bind'
        source: '${JAVA_TALES_SOURCES:?set JAVA_TALES_SOURCES}'
        target: '/sources'
        read_only: 'true'
      - type: 'bind'
        source: '${UNPACK_INPUT:?set UNPACK_INPUT}'
        target: '/input/game.jar'
        read_only: true
      - type: 'bind'
        source: '${UNPACK_OUTPUT:?set UNPACK_OUTPUT}'
        target: '/output'
